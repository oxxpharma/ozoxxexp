name: Build and Deploy (CI/CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build Frontend & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          yarn install

      - name: Build React frontend
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ${{ secrets.REACT_APP_BACKEND_URL }}
          CI: false
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          yarn build

      - name: Package application
        run: |
          mkdir -p deploy-package/frontend_build
          cp -r frontend/build/* deploy-package/frontend_build/
          cp -r backend deploy-package/
          cp -r scripts deploy-package/
          tar -czf deploy-package.tar.gz -C deploy-package .

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: deploy-package.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to Production Server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: deploy-package

      - name: Copy package to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy-package.tar.gz"
          target: "/tmp"

      - name: Execute deploy on server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="/opt/ozoxx"
            TMP_DIR="/tmp/ozoxx-deploy"
            PKG="/tmp/deploy-package.tar.gz"

            echo "==> Extraindo pacote de deploy..."
            rm -rf "$TMP_DIR"
            mkdir -p "$TMP_DIR"
            tar -xzf "$PKG" -C "$TMP_DIR"
            rm -f "$PKG"

            echo "==> Instalando scripts mais recentes..."
            mkdir -p "$APP_DIR/scripts"
            cp "$TMP_DIR/scripts/deploy_prebuilt.sh" "$APP_DIR/scripts/deploy_prebuilt.sh"
            chmod +x "$APP_DIR/scripts/deploy_prebuilt.sh"

            echo "==> Executando deploy..."
            sudo bash "$APP_DIR/scripts/deploy_prebuilt.sh" "$TMP_DIR"
