name: Build and Deploy (CI/CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: |
          yarn install

      - name: Build React frontend
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ${{ secrets.REACT_APP_BACKEND_URL }}
          CI: false
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          yarn build

      - name: Compress frontend build artifact
        run: |
          cd frontend/build
          tar -czf ../../frontend-build.tar.gz .

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend-build.tar.gz
          retention-days: 1

  deploy-production:
    name: Deploy to Production Server
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build

      - name: Copy build artifact to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "frontend-build.tar.gz"
          target: "/tmp"

      - name: Execute deploy on server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            APP_DIR="/opt/ozoxx"
            # Garante que o script mais recente exista mesmo no primeiro deploy
            if [ -d "$APP_DIR" ]; then
              cd "$APP_DIR"
              git fetch origin main --quiet || true
              git checkout origin/main -- scripts/deploy_prebuilt.sh 2>/dev/null || true
              chmod +x scripts/deploy_prebuilt.sh 2>/dev/null || true
            fi
            sudo bash "$APP_DIR/scripts/deploy_prebuilt.sh" /tmp/frontend-build.tar.gz
